<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Noesis</title>
    <meta
      name="description"
      content="Noesis — adaptive learning infrastructure. Where your mind goes to grow."
    />
    <!--
      Brand typography (Phase G3). Inter (geometric sans, UI) + Source Serif 4
      (soft serif, long-form). preconnect hints first so font requests don't
      block on DNS/handshake.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap"
    />
    <!--
      Favicon is set at runtime from apps/web-demo/src/main.tsx so we have a
      single source of truth at apps/web-demo/src/assets/spiral-eye.svg
      (Vite hashes it on build). See main.tsx for the boot wiring.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
</html>
