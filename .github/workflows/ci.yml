name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript
        run: npm run check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  replay-determinism:
    name: Replay Determinism Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Dedicated, named gate for the replay-equivalence property suite. If this
      # job goes red, the determinism contract is broken — do not merge.
      # Intentionally separate from the main `test` job so the failure is
      # visible in the PR checklist without scrolling through unrelated output.
      - name: Run replay-equivalence + determinism gates
        run: |
          npx vitest run \
            packages/core/src/__tests__/replay.test.ts \
            packages/core/src/__tests__/determinism.test.ts

  test-core:
    name: Core Tests (named gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Named gate that surfaces @noesis-edu/core failures separately from
      # the broad `test` job, which runs every workspace's vitest suite. A
      # core-only red here is louder than a single line in the broad job.
      - name: Run @noesis-edu/core test suite
        run: npm run test:core

  core-package:
    name: Core Package (build + smoke + pack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Build dist/ first — verify:core:pack reads files listed in
      # packages/core/package.json's `files` field; if dist/ is missing the
      # pack check silently produces an under-sized artifact.
      - name: Build @noesis-edu/core
        run: npm run build:core

      # Smoke test exercises only the public exports of @noesis-edu/core
      # against src/ via tsx — catches regressions in the consumer-visible
      # surface that unit tests against internal implementation might miss.
      - name: Smoke test @noesis-edu/core
        run: npm run smoke:core

      # Sanity-check what would actually ship to npm. Mirrors the guard in
      # release.yml so we catch a broken artifact at PR time, not at tag time.
      - name: Verify pack contents
        run: |
          cd packages/core
          npm pack --dry-run --json > pack.json
          if grep -q '"src/.*\.test\.' pack.json; then
            echo "Test files leaked into the published artifact"
            exit 1
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build:packages

      - name: Build applications
        run: npm run build:apps

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/
          retention-days: 7

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: noesis-core:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --omit=dev
        continue-on-error: true
